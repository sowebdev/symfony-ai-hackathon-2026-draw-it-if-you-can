name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the container
        run: make up

      - name: Install the dependencies
        run: |
          docker compose exec -T php composer install --no-progress --quiet
          docker compose exec -T php php bin/console importmap:install --quiet

      - name: Run make ci
        run: make ci

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the container
        run: make up

      - name: Install the dependencies
        run: |
          docker compose exec -T php composer install --no-progress --quiet
          docker compose exec -T php php bin/console importmap:install --quiet

      - name: Play in a browser (make smoke)
        run: make smoke
