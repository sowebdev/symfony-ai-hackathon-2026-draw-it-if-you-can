# Short tests only: the unit tests, run in the php container. Functional tests: make test-functional.
repos:
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: make test-unit
        language: system
        pass_filenames: false
        always_run: true
      # A public repository: no secret may enter the history. Skipped, with a warning, where
      # gitleaks is not installed (https://github.com/gitleaks/gitleaks).
      - id: gitleaks
        name: no secret in the commit
        entry: bash -c 'if command -v gitleaks >/dev/null; then gitleaks protect --staged --no-banner --redact; else echo "gitleaks is not installed, secrets not checked"; fi'
        language: system
        pass_filenames: false
        always_run: true
