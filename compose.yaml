# A single service: the game and its tools. The SQLite database is a file under var/.
# The models are reached at the addresses of AI_* in .env. host.docker.internal is the machine
# itself, where a local server such as Ollama usually runs. Another setup (a Docker network of
# your own, for instance) goes in compose.override.yaml, which is not committed.
services:
  php:
    build:
      context: docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8040}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
