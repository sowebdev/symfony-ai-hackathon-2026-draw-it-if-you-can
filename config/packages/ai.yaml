ai:
    platform:
        # One OpenAI-compatible endpoint per role: a local llama.cpp server or a provider's API.
        # No model catalog: the generic bridge accepts any model name. Whether the model can do
        # its job (see an image, for the guesser) is checked by trying it: bin/console app:ai:check.
        generic:
            drawer:
                base_url: '%env(AI_DRAWER_BASE_URL)%'
                api_key: '%env(default::AI_DRAWER_API_KEY)%'
            guesser:
                base_url: '%env(AI_GUESSER_BASE_URL)%'
                api_key: '%env(default::AI_GUESSER_API_KEY)%'
