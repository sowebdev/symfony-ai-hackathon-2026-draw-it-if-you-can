# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # The game only calls models. A local model loads on its first call: 14 GB read from the disk
    # took more than the 60 s of PHP's default_socket_timeout (13/11/2026).
    http_client:
        default_options:
            timeout: 300

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
