# An agent connected over MCP plays along: as a copilot it whispers words to the player, as a rival
# in a duel it guesses against them (src/Mcp). Over HTTP at http://127.0.0.1:8040/mcp, or over STDIO with bin/console mcp:server.
mcp:
    servers:
        default:
            name: 'draw-it-if-you-can'
            registry: ['App\Mcp\']
            transports:
                http: true
                stdio: true
            http:
                path: /mcp
