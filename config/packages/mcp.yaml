# The copilot: an agent connected over MCP watches the drawing of the AI and whispers words to the
# player (src/Mcp). Over HTTP at http://127.0.0.1:8040/mcp, or over STDIO with bin/console mcp:server.
mcp:
    servers:
        default:
            name: 'draw-it-if-you-can'
            registry: ['App\Mcp\']
            transports:
                http: true
                stdio: true
            http:
                path: /mcp
