monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - ai # One line per call to a model (src/Ai/ModelCallLog.php), added up by app:ai:usage

when@dev:
    monolog:
        handlers:
            # Each call to a model, one JSON object a line, outside the tests: app:ai:usage reads it.
            model_calls:
                type: stream
                path: "%kernel.logs_dir%/ai.log"
                level: info
                channels: [ai]
                formatter: monolog.formatter.json
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Each call to a model, one JSON object a line, outside the tests: app:ai:usage reads it.
            model_calls:
                type: stream
                path: "%kernel.logs_dir%/ai.log"
                level: info
                channels: [ai]
                formatter: monolog.formatter.json
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json

when@smoke:
    monolog:
        handlers:
            # Each call to a model, one JSON object a line, outside the tests: app:ai:usage reads it.
            model_calls:
                type: stream
                path: "%kernel.logs_dir%/ai.log"
                level: info
                channels: [ai]
                formatter: monolog.formatter.json
